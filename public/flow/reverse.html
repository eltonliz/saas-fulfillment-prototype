<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逆向与异常流程 · 进销存业务流程图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans SC', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { font-size: 0.85rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">进销存 · 业务流程图 / REVERSE &amp; EXCEPTION</p>
    <h1>逆向与异常流程</h1>
    <p class="sub">三条逆向链路：发货前退款 · 收货异常（配送差异）· 提货后退货返厂　｜　圆角矩形=处理步骤（含执行角色），实心圆点=链路终点</p>

    <svg viewBox="0 0 1280 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reverse-flow-title reverse-flow-desc">
      <title id="reverse-flow-title">逆向与异常流程</title>
      <desc id="reverse-flow-desc">三条逆向处理链路：发货前退款由系统直接退款并同步关闭发货任务；收货点验异常自动生成配送差异单，经门店举证、总部审核后按谁发货谁补发；提货后退货由门店收货发起返厂，实物退回供应商，退款由总部独立执行。底部为三条异常防线。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Track dividers -->
      <line x1="40" y1="224" x2="1240" y2="224" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="384" x2="1240" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>

      <!-- Track labels -->
      <text x="104" y="144" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle" letter-spacing="0.14em">退款</text>
      <text x="104" y="304" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle" letter-spacing="0.14em">收货异常</text>
      <text x="104" y="464" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle" letter-spacing="0.14em">提货后退货</text>

      <!-- Arrows (before boxes) -->
      <line x1="326" y1="140" x2="356" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="534" y1="140" x2="562" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="574" cy="140" r="4" fill="#2d3142"/>
      <text x="588" y="145" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">退款完成</text>

      <line x1="326" y1="300" x2="356" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="534" y1="300" x2="562" y2="300" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="742" y1="300" x2="770" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="950" y1="300" x2="978" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="990" cy="300" r="4" fill="#2d3142"/>
      <text x="1004" y="305" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">补发到货 · 续接主流程</text>

      <line x1="326" y1="460" x2="356" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="534" y1="460" x2="562" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="742" y1="460" x2="770" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <circle cx="782" cy="460" r="4" fill="#2d3142"/>
      <text x="796" y="465" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">返厂闭环 · 退款独立完成</text>

      <!-- Track A · 退款 -->
      <rect x="154" y="104" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="162" y="110" width="44" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="184" y="124" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">客户</text>
      <text x="240" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">发货前退款</text>
      <text x="240" y="170" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">客户申请退款</text>

      <rect x="362" y="104" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="370" y="110" width="44" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="392" y="124" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">系统</text>
      <text x="448" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">直接退款</text>
      <text x="448" y="170" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">同步关闭对应发货任务</text>

      <!-- Track B · 收货异常 -->
      <rect x="154" y="264" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="162" y="270" width="44" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="184" y="284" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">门店</text>
      <text x="240" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">收货点验异常</text>
      <text x="240" y="330" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">少收 / 破损 / 错货</text>

      <rect x="362" y="264" width="172" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="370" y="270" width="44" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="392" y="284" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">系统</text>
      <text x="448" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">自动生成配送差异单</text>
      <text x="448" y="330" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">异常单不入正常列表</text>

      <rect x="570" y="264" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="578" y="270" width="80" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="618" y="284" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">门店 · 总部</text>
      <text x="656" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">举证 → 审核</text>
      <text x="656" y="330" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">差异原因 + 图片凭证</text>

      <rect x="778" y="264" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="786" y="270" width="80" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="826" y="284" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">供应商 · 总部仓</text>
      <text x="864" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">谁发货谁补发</text>
      <text x="864" y="330" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">补发单进对应列表</text>

      <!-- Track C · 提货后退货 -->
      <rect x="154" y="424" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="162" y="430" width="44" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="184" y="444" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">客户</text>
      <text x="240" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">提货后退货</text>
      <text x="240" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">客户到店提货后</text>

      <rect x="362" y="424" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="370" y="430" width="44" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="392" y="444" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">门店</text>
      <text x="448" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">收货 · 发起返厂</text>
      <text x="448" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">关联已收货供货单</text>

      <rect x="570" y="424" width="172" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="578" y="430" width="56" height="20" rx="2" fill="rgba(45,49,66,0.08)"/>
      <text x="606" y="444" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">供应商</text>
      <text x="656" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">实物退回供应商</text>
      <text x="656" y="490" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">退款由总部独立执行</text>

      <!-- 防线 band (full width) -->
      <rect x="40" y="544" width="1200" height="48" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="56" y="558" width="44" height="20" rx="2" fill="rgba(235,108,54,0.12)"/>
      <text x="78" y="572" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', sans-serif" text-anchor="middle">防线</text>
      <text x="116" y="572" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">① 货未全部到齐 → 提货码不生效　　② 已发货任务不重复发货　　③ 已完成订单不被后续到货回改</text>

      <!-- Legend -->
      <line x1="40" y1="608" x2="1240" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="120" y="622" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="142" y="632" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">处理步骤</text>
      <rect x="252" y="620" width="14" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="274" y="632" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">关键节点</text>
      <circle cx="400" cy="628" r="4" fill="#2d3142"/>
      <text x="414" y="632" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">链路终点</text>
      <rect x="528" y="620" width="14" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="550" y="632" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', sans-serif">异常防线</text>
    </svg>
  </div>
</body>
</html>
