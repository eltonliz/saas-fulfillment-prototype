    <h1>逆向与异常流程</h1>
    <p class="sub">四条逆向链路：发货前退款 · 收货异常（配送差异）· 提货后退货返厂 · 代发售后（总部审核退款 · 供应商签收验收）　｜　退款两项配置：「极速退款」命中条件自动通过（进销存差异：同步关闭对应发货任务）、「限制用户退款申请」命中条件不允许发起　｜　圆角矩形=处理步骤（含执行角色），实心圆点=链路终点</p>

      <title id="reverse-flow-title">逆向与异常流程</title>
      <desc id="reverse-flow-desc">四条逆向处理链路：发货前退款由系统直接退款并同步关闭发货任务（退款受两项配置约束：「极速退款」命中条件则无需审核自动通过，进销存差异是须同步关闭对应发货任务；「限制用户退款申请」命中条件则不允许买家发起，条件是订单发货 / 商品核销 / 全部订单）；收货点验异常自动生成配送差异单——门店上报由门店举证、总部审核，总部上报（总仓收货）举证随收货完成、由供应商审核，通过后按谁发货谁补发；提货后退货由门店收货发起返厂，实物退回供应商，退款由总部独立执行；供应商直发消费者的一件代发售后走「总部管钱、供应商管货」：总部审核（同意时从地址库的售后地址里选一个发给买家）→ 买家寄回 → 供应商签收验收 → 总部确认退款（原路退回买家）；供应商拒签则转「退货异常」，由总部裁决认可拒签关单或仍向买家退款。两侧共用同一份数据。底部为四条异常防线。</desc>

        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
